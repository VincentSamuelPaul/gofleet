syntax = "proto3";
package kvstore;

option go_package = "kvstore/proto;kvstore";

service KVStore {
    rpc Get(Key) returns (Value) {}
    rpc Set(KeyValue) returns (Ack) {}
    rpc Replicate(Key) returns (Ack) {}
}

message Key {
    string key = 1;
}

message Value {
    string value = 1;
    bool found = 2;
}

message KeyValue {
    string key = 1;
    string value = 2;
}

message Ack {
    bool ok = 1;
}